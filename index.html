<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ponto Eletrônico</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <style>
    .dia-fds { background: #f1f3f5; }
    .dia-fds input { background: transparent; }
    .col-dia { width: 8.5rem; white-space: nowrap; }
    .col-horas { width: 6.5rem; }
    .col-copiar { width: 2.5rem; }
    .sem-desc { border-color: #ffc107; }
  </style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 860px">
  <div id="login" class="text-center py-5 d-none">
    <h1 class="h3 mb-3">Ponto Eletrônico</h1>
    <button id="btn-login" class="btn btn-primary">Entrar com Google</button>
    <p id="login-erro" class="text-danger mt-3"></p>
  </div>

  <div id="app" class="d-none">
    <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
      <div>
        <label class="form-label mb-0 small">Mês</label>
        <input id="mes" type="month" class="form-control">
      </div>
      <div>
        <label class="form-label mb-0 small">Seu nome (vai no arquivo)</label>
        <input id="nome" type="text" class="form-control" style="width: 15rem" autocomplete="name">
      </div>
      <div>
        <label class="form-label mb-0 small">Valor hora (R$)</label>
        <input id="valor" type="number" min="0" step="0.01" class="form-control" style="width: 9rem">
      </div>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="status" class="small text-muted"></span>
        <button id="btn-sair" class="btn btn-sm btn-outline-secondary">Sair</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <table class="table table-sm align-middle mb-0">
        <thead><tr><th>Dia</th><th>O que fiz</th><th>Horas</th><th></th></tr></thead>
        <tbody id="dias"></tbody>
      </table>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2">
      <div>
        <div><strong id="total-horas">0h</strong> trabalhadas</div>
        <div class="fs-5"><strong id="total-valor">R$ 0,00</strong></div>
      </div>
      <button id="btn-baixar" class="btn btn-success btn-lg">Baixar .xlsx</button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
